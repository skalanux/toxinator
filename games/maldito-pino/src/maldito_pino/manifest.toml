id = "maldito-pino"
name = "Maldito Pino, hijo de pu**"
version = "0.1.0"
requires_api = "0.4"
description = "Bolos de barrio con pinos con actitud."
locales = ["es", "en"]
default_locale = "es"
players = [1, 1]
modes = ["partida"]

[controller]
layout = "motion"
skin = "toxinator"
orientation = "auto"
action = "Tirar"
back = "Volver"
hint = "Swing para tirar · incliná para efecto · × respaldo"
gestures = ["tilt", "swing"]

[controller.labels]
cross = "Tirar"
circle = "Volver"

[controller.gesture_labels]
tilt = "Inclinar"
swing = "Lanzar"

[art]
motif = "pin"
