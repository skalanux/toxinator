[project]
name = "maldito-pino"
version = "0.1.0"
description = "Maldito Pino, hijo de pu**: the first Toxinator bowling game"
requires-python = ">=3.14,<3.15"
dependencies = ["toxinator"]

[tool.uv.sources]
toxinator = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maldito_pino"]
