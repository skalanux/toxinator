[project]
name = "toxinator"
version = "0.1.0"
description = "Personal 3D game console with Wiimote and Android phone controllers"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "aiohttp>=3.14,<4",
  "panda3d==1.10.16",
  "pillow>=11,<13",
  "qrcode>=8,<9",
]

[project.scripts]
toxinator = "toxinator.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toxinator"]

[tool.uv.workspace]
members = ["games/maldito-pino"]

[tool.pytest.ini_options]
testpaths = ["tests", "games/maldito-pino/tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
files = ["src", "tests", "games/maldito-pino/src"]
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
